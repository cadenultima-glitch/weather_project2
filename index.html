<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanford SkyStation | Live Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050816;--text:#eaf2ff;--muted:#8fa3c7;--accent:#4de1ff;--accent2:#9b6bff;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(77,225,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(77,225,255,.05) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%);-webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:float 22s ease-in-out infinite}
.o1{width:520px;height:520px;background:#1d4ed8;top:-120px;left:-100px}
.o2{width:460px;height:460px;background:var(--accent2);bottom:-120px;right:-80px;animation-delay:-8s}
.o3{width:340px;height:340px;background:#06b6d4;top:40%;left:45%;animation-delay:-14s;opacity:.35}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.12)}66%{transform:translate(-50px,50px) scale(.92)}}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 48px}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15)}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.brand{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.14em;font-size:1.25rem;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.brand small{display:block;font:300 .7rem Inter;letter-spacing:.2em;color:var(--muted)}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
button{font:600 .8rem Inter;color:var(--text);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;transition:.2s}
button:hover{border-color:var(--accent);box-shadow:0 0 16px rgba(77,225,255,.35)}
#alerts{display:grid;gap:10px;margin-bottom:18px}
.alert{padding:14px 18px;border-radius:16px;background:rgba(255,80,90,.16);border:1px solid rgba(255,100,110,.5);font-size:.9rem}
.alert b{font-family:Orbitron;letter-spacing:.06em;color:#ff9aa2}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.hero{padding:30px;position:relative;overflow:hidden}
.clock{font:500 .85rem Orbitron;color:var(--accent);letter-spacing:.12em}
.loc{color:var(--muted);margin-top:4px;font-size:.9rem}
.now{display:flex;align-items:center;gap:20px;margin:22px 0 8px;flex-wrap:wrap}
.icon{font-size:5.2rem;filter:drop-shadow(0 0 24px rgba(77,225,255,.5))}
.temp{font:700 5.4rem/1 Orbitron;background:linear-gradient(180deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.temp sup{font-size:1.8rem}
.cond{font-size:1.3rem;font-weight:300}
.feels{color:var(--muted);font-size:.9rem;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:18px}
.stat{padding:16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.stat span{display:block;font-size:.68rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.stat b{font:500 1.35rem Orbitron;display:block;margin-top:6px}
h2{font:500 .8rem Orbitron;letter-spacing:.2em;color:var(--accent);margin:26px 0 12px;text-transform:uppercase}
.hourly{padding:18px}
.hours{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.hr{min-width:84px;text-align:center;padding:12px 6px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.hr div:first-child{font-size:.72rem;color:var(--muted)}
.hr .e{font-size:1.6rem;margin:6px 0}
.hr .p{font-size:.7rem;color:var(--accent)}
#spark{width:100%;height:90px;margin-top:10px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.day{padding:20px 14px;text-align:center;transition:.25s}
.day:hover{transform:translateY(-6px);border-color:var(--accent)}
.day .n{font:500 .85rem Orbitron;letter-spacing:.1em}
.day .e{font-size:2.6rem;margin:10px 0}
.day .hi{font:700 1.5rem Orbitron}
.day .lo{color:var(--muted);font-size:1rem;margin-top:2px}
.day .s{font-size:.78rem;color:var(--muted);margin-top:10px;min-height:2.4em}
.day .p{font-size:.75rem;color:var(--accent);margin-top:6px}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:30px}
#status{color:var(--accent)}
.skel{animation:pulse 1.4s infinite}
@media(max-width:900px){.grid{grid-template-columns:1fr}.days{grid-template-columns:repeat(2,1fr)}.temp{font-size:4.2rem}}
@media(max-width:480px){.days{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="wrap">
  <header>
    <div class="brand"><i></i><div>SANFORD SKYSTATION<small>LIVE ATMOSPHERIC TELEMETRY</small></div></div>
    <div class="ctrl">
      <span>Next update in <span id="status">--:--</span></span>
      <button id="unit">°F / °C</button>
      <button id="refresh">⟳ Refresh</button>
    </div>
  </header>

  <div id="alerts"></div>

  <div class="grid">
    <section class="glass hero">
      <div class="clock" id="clock">--</div>
      <div class="loc">Sanford, Florida · Orlando Sanford Intl (KSFB)</div>
      <div class="now">
        <div class="icon" id="icon">⛅</div>
        <div><div class="temp skel" id="temp">--<sup>°</sup></div></div>
      </div>
      <div class="cond" id="cond">Loading conditions…</div>
      <div class="feels" id="feels"></div>
    </section>
    <section class="glass stats" id="stats"></section>
  </div>

  <h2>Next 24 Hours</h2>
  <section class="glass hourly">
    <div class="hours" id="hours"></div>
    <svg id="spark" viewBox="0 0 600 90" preserveAspectRatio="none"></svg>
  </section>

  <h2>5-Day Forecast</h2>
  <section class="days" id="days"></section>

  <footer>Data: National Weather Service (api.weather.gov) · Auto-refreshes every 10 minutes · <span id="updated"></span></footer>
</div>

<script>
const LAT = 28.8003, LON = -81.2731, STATION = "KSFB", REFRESH = 600;
let unitF = true, data = {}, countdown = REFRESH, timer;

const $ = id => document.getElementById(id);
const T = f => f == null ? "--" : Math.round(unitF ? f : (f - 32) * 5 / 9);
const U = () => unitF ? "°F" : "°C";

function icon(text, day = true) {
  const s = (text || "").toLowerCase();
  if (s.includes("thunder")) return "⛈️";
  if (s.includes("snow") || s.includes("sleet")) return "❄️";
  if (s.includes("rain") || s.includes("shower") || s.includes("drizzle")) return "🌧️";
  if (s.includes("fog") || s.includes("haze") || s.includes("mist")) return "🌫️";
  if (s.includes("partly") || s.includes("mostly sunny") || s.includes("mostly clear")) return day ? "⛅" : "☁️";
  if (s.includes("cloud") || s.includes("overcast")) return "☁️";
  if (s.includes("wind")) return "💨";
  return day ? "☀️" : "🌙";
}
const getJSON = async url => {
  const r = await fetch(url, { headers: { Accept: "application/geo+json" } });
  if (!r.ok) throw new Error(r.status);
  return r.json();
};

async function load() {
  $("status").textContent = "updating…";
  try {
    const pt = await getJSON(`https://api.weather.gov/points/${LAT},${LON}`);
    const p = pt.properties;
    const [obs, daily, hourly, alerts] = await Promise.allSettled([
      getJSON(`https://api.weather.gov/stations/${STATION}/observations/latest`),
      getJSON(p.forecast),
      getJSON(p.forecastHourly),
      getJSON(`https://api.weather.gov/alerts/active?point=${LAT},${LON}`)
    ]);
    data = {
      obs: obs.value?.properties,
      daily: daily.value?.properties?.periods || [],
      hourly: hourly.value?.properties?.periods || [],
      alerts: alerts.value?.features || []
    };
    render();
    $("updated").textContent = "Last updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) {
    $("cond").textContent = "Unable to reach the NWS right now. Retrying automatically…";
    console.error(e);
  }
  countdown = REFRESH;
}

function render() {
  const { obs, daily, hourly, alerts } = data;
  const h0 = hourly[0] || {};
  const isDay = h0.isDaytime !== false;
  const text = obs?.textDescription || h0.shortForecast || "—";
  let tF = obs?.temperature?.value != null ? obs.temperature.value * 9 / 5 + 32 : h0.temperature;

  $("temp").classList.remove("skel");
  $("temp").innerHTML = `${T(tF)}<sup>${U()}</sup>`;
  $("icon").textContent = icon(text, isDay);
  $("cond").textContent = text;

  const fl = obs?.heatIndex?.value ?? obs?.windChill?.value;
  const flF = fl != null ? fl * 9 / 5 + 32 : tF;
  $("feels").textContent = `Feels like ${T(flF)}${U()}`;

  const mph = obs?.windSpeed?.value != null ? obs.windSpeed.value * 0.621371 : null;
  const gust = obs?.windGust?.value != null ? obs.windGust.value * 0.621371 : null;
  const dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  const wd = obs?.windDirection?.value != null ? dirs[Math.round(obs.windDirection.value / 22.5) % 16] : "";
  const dewF = obs?.dewpoint?.value != null ? obs.dewpoint.value * 9 / 5 + 32 : null;
  const pres = obs?.barometricPressure?.value;
  const vis = obs?.visibility?.value;
  const rain = h0.probabilityOfPrecipitation?.value;

  const spd = v => v == null ? "--" : unitF ? Math.round(v) + " mph" : Math.round(v * 1.60934) + " km/h";
  const stats = [
    ["Humidity", obs?.relativeHumidity?.value != null ? Math.round(obs.relativeHumidity.value) + "%" : "--"],
    ["Wind", `${wd} ${spd(mph)}`],
    ["Gusts", gust ? spd(gust) : "Calm"],
    ["Dew Point", T(dewF) + U()],
    ["Pressure", pres != null ? (unitF ? (pres * 0.0002953).toFixed(2) + " inHg" : Math.round(pres / 100) + " hPa") : "--"],
    ["Visibility", vis != null ? (unitF ? (vis / 1609.34).toFixed(1) + " mi" : (vis / 1000).toFixed(1) + " km") : "--"],
    ["Rain Chance", rain != null ? rain + "%" : "0%"],
    ["Sky", h0.shortForecast || "--"]
  ];
  $("stats").innerHTML = stats.map(s => `<div class="stat"><span>${s[0]}</span><b style="font-size:${s[1].length > 10 ? '.95rem' : '1.35rem'}">${s[1]}</b></div>`).join("");

  $("alerts").innerHTML = alerts.map(a => `<div class="alert glass"><b>⚠ ${a.properties.event.toUpperCase()}</b><br>${a.properties.headline || ""}</div>`).join("");

  // hourly
  const hrs = hourly.slice(0, 24);
  $("hours").innerHTML = hrs.map(h => {
    const d = new Date(h.startTime);
    const lbl = d.toLocaleTimeString([], { hour: "numeric" });
    return `<div class="hr"><div>${lbl}</div><div class="e">${icon(h.shortForecast, h.isDaytime)}</div><div>${T(h.temperature)}°</div><div class="p">💧${h.probabilityOfPrecipitation?.value ?? 0}%</div></div>`;
  }).join("");
  spark(hrs.map(h => h.temperature));

  // 5-day
  const days = [];
  daily.forEach(p => {
    if (p.isDaytime) days.push({ name: p.name, hi: p.temperature, s: p.shortForecast, pop: p.probabilityOfPrecipitation?.value, day: true });
    else if (days.length && days[days.length - 1].lo == null) days[days.length - 1].lo = p.temperature;
    else days.push({ name: p.name, lo: p.temperature, s: p.shortForecast, pop: p.probabilityOfPrecipitation?.value, day: false });
  });
  $("days").innerHTML = days.slice(0, 5).map(d => `
    <div class="glass day"><div class="n">${d.name.toUpperCase()}</div>
    <div class="e">${icon(d.s, d.day)}</div>
    <div class="hi">${d.hi != null ? T(d.hi) + "°" : "--"}</div>
    <div class="lo">${d.lo != null ? T(d.lo) + "°" : ""}</div>
    <div class="s">${d.s}</div><div class="p">💧 ${d.pop ?? 0}%</div></div>`).join("");
}

function spark(vals) {
  if (vals.length < 2) return;
  const min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * 600, 75 - (v - min) / r * 60]);
  const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  $("spark").innerHTML = `<defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4de1ff" stop-opacity=".45"/><stop offset="1" stop-color="#4de1ff" stop-opacity="0"/></linearGradient></defs>
    <path d="${path} L600 90 L0 90Z" fill="url(#g)"/><path d="${path}" fill="none" stroke="#4de1ff" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
}

function tick() {
  $("clock").textContent = new Date().toLocaleString([], { weekday: "long", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit" }).toUpperCase();
  if (--countdown <= 0) load();
  else $("status").textContent = `${Math.floor(countdown / 60)}:${String(countdown % 60).padStart(2, "0")}`;
}

$("unit").onclick = () => { unitF = !unitF; if (data.hourly) render(); };
$("refresh").onclick = load;
load();
timer = setInterval(tick, 1000);
</script>
</body>
</html>
